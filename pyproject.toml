[project]
name = "revenue-engine-ai"
version = "0.1.0"
description = "Revenue Engine AI service — requirement extraction, semantic search, answer drafting, client queries and review for the proposal builder. Never changes business state."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.12,<2",
    "openai>=1.99",
    "fastembed>=0.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # OCR for scanned PDFs, local and free: pdfium renders the page, RapidOCR (ONNX on CPU) reads it.
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["revenue_engine_ai*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["revenue_engine_ai"]
known-local-folder = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["revenue_engine_ai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
